<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
  </g>

  <!-- Dynamic Rocket / Sparkle Geometric Mark -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Central Sparkle Diamond -->
    <path d="M 0 -130 Q 0 0 130 0 Q 0 0 0 130 Q 0 0 -130 0 Q 0 0 0 -130 Z" fill="#ffffff" />
    <!-- Inner Core Glow -->
    <path d="M 0 -75 Q 0 0 75 0 Q 0 0 0 75 Q 0 0 -75 0 Q 0 0 0 -75 Z" fill="url(#glowGrad)" />
    
    <!-- Top-Right Accent Sparkle -->
    <path d="M 120 -120 Q 120 -80 160 -80 Q 120 -80 120 -40 Q 120 -80 80 -80 Q 120 -80 120 -120 Z" fill="#38bdf8" />
    
    <!-- Bottom-Left Small Accent Sparkle -->
    <path d="M -110 110 Q -110 135 -85 135 Q -110 135 -110 160 Q -110 135 -135 135 Q -110 135 -110 110 Z" fill="#e0e7ff" />
  </g>
</svg>
